<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperar contraseña</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/StyleLogin.css}">
    </head>

    <body>

        <div class="login-card">

            <div class="login-header">
                <h2>Recuperar contraseña</h2>
                <p>Ingresa tu correo y te enviaremos un enlace</p>
            </div>

            <div class="mb-4 input-group-custom">
                <i class="fa fa-envelope input-icon"></i>
                <input type="email"
                       id="email"
                       class="form-control"
                       placeholder="Correo electrónico"
                       required>
            </div>

            <button class="btn btn-login" onclick="resetPass()">
                <i class="fa fa-paper-plane"></i> Enviar enlace
            </button>

            <div class="extra-links">
                <a th:href="@{/Login}">Volver al login</a>
            </div>

        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script th:inline="javascript">
                const serverContext = /*[[@{/}]]*/ "/";

                function resetPass() {
                    const email = $("#email").val();

                    if (!email) {
                        alert("Ingresa tu correo electrónico");
                        return;
                    }

                    $.post(serverContext + "user/resetPassword", {email: email})
                            .done(function (data) {
                                window.location.href =
                                        serverContext + "Login?message=" + data.message;
                            })
                            .fail(function (data) {
                                if (data.responseJSON?.error?.includes("MailError")) {
                                    window.location.href = serverContext + "emailError";
                                } else {
                                    window.location.href =
                                            serverContext + "Login?message=" + data.responseJSON.message;
                                }
                            });
                }
        </script>

    </body>
</html>
