<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nueva contraseña</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/StyleLogin.css}">
    </head>

    <body>

        <div class="login-card">

            <div class="login-header">
                <h2>Nueva contraseña</h2>
                <p>Ingresa y confirma tu nueva contraseña</p>
            </div>

            <div class="mb-4 input-group-custom">
                <i class="fa fa-lock input-icon"></i>
                <input type="password"
                       id="password"
                       class="form-control"
                       placeholder="Nueva contraseña"
                       required>
            </div>

            <div class="mb-4 input-group-custom">
                <i class="fa fa-lock input-icon"></i>
                <input type="password"
                       id="confirmPassword"
                       class="form-control"
                       placeholder="Confirmar contraseña"
                       required>
            </div>

            <button class="btn btn-login mb-3" onclick="changePassword()">
                <i class="fa fa-key"></i> Cambiar contraseña
            </button>

            <button class="btn btn-secondary w-100" onclick="cancel()">
                <i class="fa fa-xmark"></i> Cancelar
            </button>

        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <script th:inline="javascript">
                const serverContext = /*[[@{/}]]*/ "/";
                const token = new URLSearchParams(window.location.search).get("token");

                function changePassword() {
                    const password = $("#password").val();
                    const confirmPassword = $("#confirmPassword").val();

                    if (!password || !confirmPassword) {
                        alert("Completa todos los campos");
                        return;
                    }

                    if (password !== confirmPassword) {
                        alert("Las contraseñas no coinciden");
                        return;
                    }

                    $.post(serverContext + "user/savePassword", {
                        token: token,
                        password: password
                    })
                            .done(function (data) {
                                window.location.href =
                                        serverContext + "Login?message=" + data.message;
                            })
                            .fail(function (data) {
                                alert(data.responseJSON?.message || "Error al cambiar la contraseña");
                            });
                }

                function cancel() {
                    window.location.href = serverContext + "Login";
                }
        </script>

    </body>
</html>
